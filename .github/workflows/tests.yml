name: Game checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          prune-cache: true
      - run: uv sync --locked --python 3.13
      - run: uv run python scripts/dev.py check
      - run: uv run python scripts/dev.py test --parallel 2
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          prune-cache: true
      - run: uv sync --locked --python 3.13
      - run: uv run python -m unittest discover -s scripts/tests -p test_smoke_ownership.py
      - run: uv run python scripts/dev.py smoke
      - run: uv run python scripts/action_e2e.py
      - name: 실패 진단 로그 출력 (DB 제외)
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in sorted(Path('work/smoke').glob('**/*.log')):
              print(f'--- {path} (last 80 lines) ---')
              print('\n'.join(path.read_text(encoding='utf-8', errors='replace').splitlines()[-80:]))
          PY
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: uv sync --locked --python 3.13
      - run: npm ci
      - run: npx playwright install --with-deps --no-shell chromium
      - run: uv run python -m unittest discover -s scripts/tests -p test_browser_runner.py
      - run: uv run python -m unittest discover -s scripts/tests -p test_integration_runner.py
      - run: npm run test:browser
      - run: npm run test:browser:integration
      - name: Sanitized 브라우저 검증 증거
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-e2e-${{ github.sha }}
          path: work/browser-evidence/
          if-no-files-found: warn
          retention-days: ${{ job.status == 'success' && 14 || 30 }}
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm run test:contracts
      - run: uv sync --locked --python 3.13
      - run: uv run python scripts/issue50_contracts.py
