[project]
name = "primal-zone"
version = "0.1.0"
description = "원시구역 — 혼자서도 즐기는 한국어 성장형 MUD"
requires-python = ">=3.13,<3.14"
dependencies = ["evennia==6.1.0"]

[dependency-groups]
dev = [
    "ruff>=0.12,<1",
    "websockets>=15,<17",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
